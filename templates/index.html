  function pieceHTML(type, color) {
    var key = color + type;
    return '<img class="pc" data-key="' + key + '" alt="" draggable="false" src="data:image/webp;base64,' + IMG[key] + '">';
  }

  /* ---------- 4. FIND WHICH PIECE IS ON A SQUARE ---------- */
  var OUTLINE = { '♔': 'K', '♕': 'Q', '♖': 'R', '♗': 'B', '♘': 'N', '♙': 'P' };
  var SOLID   = { '♚': 'K', '♛': 'Q', '♜': 'R', '♝': 'B', '♞': 'N', '♟': 'P' };

  function pieceOf(el) {
    var d = el.dataset || {};
    var raw = d.piece || d.p || '';
    if (/^[wb][KQRBNPkqrbnp]$/.test(raw)) return { c: raw[0], t: raw[1].toUpperCase() };

    var txt = (el.textContent || '').replace(/[\s\uFE0E\uFE0F]/g, '');
    var ch = txt.charAt(0);
    if (OUTLINE[ch]) return { c: 'w', t: OUTLINE[ch] };
    if (SOLID[ch]) {
      var cls = el.className || '';
      var c = /\bwhite\b|\bw-piece\b|piece-w/i.test(cls) || d.color === 'w' || d.color === 'white' ? 'w' : 'b';
      return { c: c, t: SOLID[ch] };
    }
    return null;
  }

  /* ---------- 5. PAINT THE BOARD ---------- */
  var board, obs, queued = false;

  function paint() {
    queued = false;
    if (!board) return;
    obs.disconnect();
    board.querySelectorAll('.sq').forEach(function (sq) {
      var old = sq.querySelector(':scope > img.pc');
      var pc = pieceOf(sq);
      if (!pc) {
        if (old) old.remove();
        sq.classList.remove('has-royal');
        return;
      }
      var key = pc.c + pc.t;
      if (old && old.getAttribute('data-key') === key) { sq.classList.add('has-royal'); return; }
      if (old) old.remove();
      sq.insertAdjacentHTML('afterbegin', pieceHTML(pc.t, pc.c));
      sq.classList.add('has-royal');
    });
    watch();
  }
  function watch() { obs.observe(board, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['data-piece', 'class'] }); }
  function schedule() { if (!queued) { queued = true; requestAnimationFrame(paint); } }

  var GAME_NAME = 'REUBEN SOUL WORLD PEACE CHESS';
  function applyName() {
    document.title = GAME_NAME;
    var h = document.querySelector('main h1') || document.querySelector('h1');
    if (h) h.textContent = GAME_NAME;
  }

  function start() {
    applyName();
    board = document.getElementById('board');
    if (!board) { return; }
    obs = new MutationObserver(function (m) {
      // ignore changes caused only by our own svg
      for (var i = 0; i < m.length; i++) {
        var t = m[i].target;
        if (!(t.nodeType === 1 && t.closest && t.closest('img.pc'))) { schedule(); return; }
      }
    });
    watch();
    paint();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
