   White army: crimson + gold, emerald jewels

   Drop in static/ and add before </body> in templates/index.html:
     <script src="/static/royal-theme.js" defer><\/script>

*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1b2f4d 0%,#0b1424 70%);color:#eef4fb;font-family:Georgia,'Times New Roman',serif;padding:16px;min-height:100vh}
main{max-width:720px;margin:auto}
h1{font-size:28px;margin:0 0 10px;text-align:center;letter-spacing:1px;
  background:linear-gradient(90deg,#b8860b,#fff1a8,#f2c14e,#fff1a8,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
button,select{padding:11px;border-radius:8px;border:1px solid #c9a54a;background:linear-gradient(#2a3f5f,#1a2a44);color:#f7e7b0;font-family:inherit}
button{cursor:pointer;transition:transform .12s,box-shadow .12s}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 10px rgba(242,193,78,.35)}
button:disabled{cursor:default;opacity:.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.clock{font:bold 38px monospace;background:linear-gradient(#2c4262,#1b2b45);border:1px solid #8a6d22;border-radius:12px;padding:12px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;color:#ffe8a3}
.clock small{font:17px Georgia,serif;color:#e8d6a0}
.running{outline:3px solid #f2c14e;box-shadow:0 0 18px rgba(242,193,78,.5)}
.low{color:#ff7979}

/* Board: gold frame, ivory + burgundy-wood squares */
#board{display:grid;grid-template-columns:repeat(8,1fr);
  border:10px solid transparent;border-radius:6px;
  background:linear-gradient(#101b2c,#101b2c) padding-box,

.sq{position:relative;aspect-ratio:1;border:0;border-radius:0;padding:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(24px,7.8vw,60px);color:#090909;font-family:'DejaVu Sans','Segoe UI Symbol',serif;box-shadow:none}
.sq:hover:not(:disabled){transform:none;box-shadow:inset 0 0 0 3px rgba(242,193,78,.6)}
.light{background:var(--orn-l),radial-gradient(circle at 30% 30%,#fff4d6,#ecd7a6)}
.dark{background:var(--orn-d),radial-gradient(circle at 30% 30%,#a8454f,#6e1f2b)}
.selected{box-shadow:inset 0 0 0 5px #f2c14e,inset 0 0 22px rgba(255,241,168,.8)!important}
.legal:after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff1a8,#d9a520);box-shadow:0 0 8px rgba(242,193,78,.9);z-index:3}
.coord{position:absolute;left:3px;bottom:2px;font:10px Arial;color:#3b2a10;opacity:.75;z-index:1}
.dark .coord{color:#f3dba0}

/* 3D royal pieces: --piece-w = piece width relative to its square (bigger = larger pieces) */
:root{--piece-w:100%}
.sq{overflow:visible}
#board{margin-top:50px}
.sq img.pc{position:absolute;left:50%;bottom:-7%;width:var(--piece-w);height:auto;transform:translateX(-50%);z-index:2;
  pointer-events:none;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 6px 5px rgba(0,0,0,.55));transition:transform .15s,filter .15s;transform-origin:50% 90%}
.sq:hover img.pc{transform:translateX(-50%) translateY(-3px) scale(1.04);filter:drop-shadow(0 10px 8px rgba(0,0,0,.6)) drop-shadow(0 0 10px rgba(255,214,102,.55))}
.sq.has-royal{font-size:0;color:transparent}

#status,#notice{padding:10px;background:linear-gradient(#2a3f5f,#1d2f4b);border:1px solid #6e5a22;border-radius:8px;margin:8px 0;color:#f6ead0}
#notice:empty{display:none}#notice{color:#ffd484}
#moves{max-height:140px;overflow:auto;line-height:1.7}
input{width:100%;padding:9px;margin:4px 0;background:#1d3048;color:#e8f1fb;border:1px solid #8a6d22;border-radius:6px}
p,label{font-size:14px;color:#c3d0e0}
a{color:#ffd978}
#links{margin:12px 0}
details{margin:16px 0}
[hidden]{display:none!important}
body.clean #creator,body.clean #links,body.clean #actions,body.clean #notes,body.clean footer{display:none!important}
button:focus-visible,a:focus-visible{outline:3px solid #f2c14e}

  function pieceHTML(type, color) {
    var key = color + type;
    return '<img class="pc" data-key="' + key + '" alt="" draggable="false" src="data:image/webp;base64,' + IMG[key] + '">';
  }

  /* ---------- 4. FIND WHICH PIECE IS ON A SQUARE ---------- */
  var OUTLINE = { '♔': 'K', '♕': 'Q', '♖': 'R', '♗': 'B', '♘': 'N', '♙': 'P' };
  var SOLID   = { '♚': 'K', '♛': 'Q', '♜': 'R', '♝': 'B', '♞': 'N', '♟': 'P' };

  function pieceOf(el) {
    var d = el.dataset || {};
    var raw = d.piece || d.p || '';
    if (/^[wb][KQRBNPkqrbnp]$/.test(raw)) return { c: raw[0], t: raw[1].toUpperCase() };

    var txt = (el.textContent || '').replace(/[\s\uFE0E\uFE0F]/g, '');
    var ch = txt.charAt(0);
    if (OUTLINE[ch]) return { c: 'w', t: OUTLINE[ch] };
    if (SOLID[ch]) {
      var cls = el.className || '';
      var c = /\bwhite\b|\bw-piece\b|piece-w/i.test(cls) || d.color === 'w' || d.color === 'white' ? 'w' : 'b';
      return { c: c, t: SOLID[ch] };
    }
    return null;
  }

  /* ---------- 5. PAINT THE BOARD ---------- */
  var board, obs, queued = false;

  function paint() {
    queued = false;
    if (!board) return;
    obs.disconnect();
    board.querySelectorAll('.sq').forEach(function (sq) {
      var old = sq.querySelector(':scope > img.pc');
      var pc = pieceOf(sq);
      if (!pc) {
        if (old) old.remove();
        sq.classList.remove('has-royal');
        return;
      }
      var key = pc.c + pc.t;
      if (old && old.getAttribute('data-key') === key) { sq.classList.add('has-royal'); return; }
      if (old) old.remove();
      sq.insertAdjacentHTML('afterbegin', pieceHTML(pc.t, pc.c));
      sq.classList.add('has-royal');
    });
    watch();
  }
  function watch() { obs.observe(board, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ['data-piece', 'class'] }); }
  function schedule() { if (!queued) { queued = true; requestAnimationFrame(paint); } }

  function start() {
    board = document.getElementById('board');
    if (!board) { return; }
    obs = new MutationObserver(function (m) {
      // ignore changes caused only by our own svg
      for (var i = 0; i < m.length; i++) {
        var t = m[i].target;
        if (!(t.nodeType === 1 && t.closest && t.closest('img.pc'))) { schedule(); return; }
      }
    });
    watch();
    paint();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
